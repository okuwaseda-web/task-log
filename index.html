<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="実績管理簿">
<meta name="theme-color" content="#0f766e">
<title>タスク実績管理簿</title>
<link rel="stylesheet" href="premium-dashboard.css">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f5;--card:#fff;--tx:#1d2521;--mu:#6b756f;--bd:#dfe4e0;--ac:#0f766e;--ac2:#e3f2ef;--up:#0f766e;--dn:#b4472f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1d2320;--tx:#e8ede9;--mu:#9aa59f;--bd:#2d3632;--ac:#3cc2b4;--ac2:#1f3a36;--up:#3cc2b4;--dn:#f0906f}}
:root[data-theme="dark"]{--bg:#141816;--card:#1d2320;--tx:#e8ede9;--mu:#9aa59f;--bd:#2d3632;--ac:#3cc2b4;--ac2:#1f3a36;--up:#3cc2b4;--dn:#f0906f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.6 "Hiragino Sans","Noto Sans JP",Meiryo,system-ui,sans-serif}main{max-width:860px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 14px}h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}label{font-size:12px;color:var(--mu);display:block;margin-bottom:2px}input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}.f{flex:1;min-width:130px}.f input,.f select{width:100%}.chips button{padding:4px 9px;font-size:12px}.focus{display:flex;gap:4px}.focus button{flex:1;padding:6px 2px;font-size:12px;line-height:1.3}.focus button.on,.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.nav{justify-content:space-between;margin-bottom:12px}.lbl{font-weight:700;font-size:16px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi{background:var(--ac2);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mu)}.d{font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px;overflow-x:auto}.bk{flex:1;min-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer;font-size:11px;color:var(--mu)}.bk .bar{width:100%;max-width:46px;background:var(--ac);border-radius:5px 5px 0 0;min-height:2px}.bk.cur{color:var(--tx);font-weight:700}.bk.cur .bar{outline:2px solid var(--tx);outline-offset:1px}.leg{font-size:11px;color:var(--mu);margin-top:6px}.chart .bk{min-width:52px}.ht{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600}.bk .pb{background:transparent;border:2px dashed var(--ac);border-bottom:none}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}.share{display:inline-block;height:8px;background:var(--ac);border-radius:4px;vertical-align:middle}.x{padding:2px 8px;font-size:12px;color:var(--mu)}.empty{color:var(--mu);text-align:center;padding:14px}.dots{letter-spacing:1px;color:var(--ac)}
@media (max-width:560px){
  main{padding:14px 12px 28px}
  h1{margin-bottom:18px}
  .card{padding:12px;border-radius:10px;margin-bottom:10px}
  .row{gap:6px}
  .f{flex:1 1 100%;min-width:0}
  #formcard .row{display:flex;flex-direction:column;align-items:stretch}
  .chips{display:flex;flex-wrap:wrap}
  .chips button{flex:1 1 30%;min-width:0}
  .focus{gap:4px}
  .focus button{font-size:10px;min-height:46px;padding:6px 1px;line-height:1.2}
  .nav{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin:18px 0 10px}
  .nav > .row{width:100%;justify-content:space-between}
  .tabs{display:flex;justify-content:space-between;width:100%}
  .tabs button{flex:1;padding:8px 4px;font-size:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 8px}
  .kpi b{font-size:18px}
  .chart{height:120px}
  .chart .bk{min-width:42px}
  #vtabs{width:100% !important;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px !important}
  #vtabs button{padding:7px 4px;font-size:11px}
  .nav .row:first-child{width:100%}
  .nav .lbl{min-width:0;flex:1;text-align:center}
  .sc table{min-width:520px}
  #hcard .chart{height:110px}
}
@media (max-width:380px){
  main{padding:12px 10px 24px}
  .kpis{grid-template-columns:1fr 1fr}
  .chips button{flex-basis:31%}
  .nav .row{gap:4px}
}
</style>
</head>
<body>
<main>
<h1>タスク実績管理簿</h1>
<div class="tabs row" id="vtabs" style="margin-bottom:12px"><button data-view="actual">実績</button><button data-view="plan">予定</button><button data-view="cmp">予実比較</button></div>
<section class="card" id="formcard">
  <h2 id="ftitle">実績を記録</h2>
  <div class="row">
    <div class="f"><label>日付</label><input type="date" id="date"></div>
    <div class="f" style="flex:2;min-width:180px"><label>タスク名</label><input id="task" placeholder="例：企画書のドラフト" style="width:100%"></div>
  </div>
  <div class="row" style="margin-top:8px">
    <div class="f"><label>種類</label><select id="type"></select></div>
    <div class="f" id="ntw" hidden><label>新しい種類</label><input id="ntype" placeholder="種類名"></div>
    <div class="f"><label>時間（分）</label><input type="number" id="min" min="1" step="5" placeholder="60"></div>
    <div class="f"><label>開始時刻（任意）</label><input type="time" id="start"></div>
  </div>
  <div class="row chips" style="margin:6px 0">
    <button data-m="15">15分</button><button data-m="30">30分</button><button data-m="60">1時間</button><button data-m="90">1.5時間</button><button data-m="120">2時間</button>
  </div>
  <label id="flab">集中力</label>
  <div class="focus" id="focus"></div>
  <div class="row" style="margin-top:10px">
    <button class="pri" id="add">記録する</button><span id="msg" class="d" style="color:var(--mu)"></span>
  </div>
</section>

<div class="row nav">
  <div class="tabs row" id="tabs"><button data-mode="day">日次</button><button data-mode="week">週次</button><button data-mode="month">月次</button></div>
  <div class="row"><button id="prev">◀</button><span class="lbl" id="lbl"></span><button id="next">▶</button><button id="today">今日</button></div>
</div>

<section class="card"><div class="kpis" id="kpis"></div></section>
<section class="card"><h2 id="ctitle"></h2><div class="chart" id="chart"></div><div class="leg" id="leg">棒の高さ＝合計時間／濃さ＝平均集中度（濃いほど高い）／タップでその期間へ移動</div></section>
<section class="card"><h2>種類別（前の期間との比較つき）</h2><div class="sc" id="types"></div></section>
<section class="card" id="hcard"><div class="ht">集中力が高い時間帯（開始時刻つきの記録から集計）</div><div id="hsum" class="d" style="margin-bottom:8px"></div><div class="chart" id="hchart" style="height:130px"></div><div class="leg">棒の高さ＝その時間帯の平均集中度（時間加重）／濃さ＝記録時間の多さ。日をまたぐ分は含みません</div></section>
<section class="card"><h2>記録一覧</h2><div class="sc" id="list"></div></section>
<p class="d" style="color:var(--mu)">データはこのブラウザ内に保存されます（端末をまたいで共有はされません）。</p>
</main>

<script>
const KEY='taskLogV1',FL=['散漫','やや低','普通','高い','没頭'];
let S={entries:[],types:['開発','会議','企画','資料作成','学習','事務']};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmt=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?h+'時間'+(r?r+'分':''):r+'分'};
const WD=['日','月','火','水','木','金','土'];
let mode='day',anchor=ymd(new Date()),focus=3,view='actual';

function range(m,a){const d=pd(a);
  if(m==='day')return[a,a];
  if(m==='week'){const w=(d.getDay()+6)%7,s=new Date(d);s.setDate(d.getDate()-w);const e=new Date(s);e.setDate(s.getDate()+6);return[ymd(s),ymd(e)]}
  return[ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))]}
function shift(m,a,n){const d=pd(a);
  if(m==='day')d.setDate(d.getDate()+n);else if(m==='week')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}
  return ymd(d)}
function label(m,a){const d=pd(a),[s,e]=range(m,a);
  if(m==='day')return `${d.getMonth()+1}/${d.getDate()}（${WD[d.getDay()]}）`;
  if(m==='week')return `${s.slice(5).replace('-','/')} 〜 ${e.slice(5).replace('-','/')}`;
  return `${d.getFullYear()}年${d.getMonth()+1}月`}
function short(m,a){const d=pd(a);
  if(m==='day')return `${d.getMonth()+1}/${d.getDate()}`;
  if(m==='week')return `${range(m,a)[0].slice(5).replace('-','/')}〜`;
  return `${d.getMonth()+1}月`}
const inRk=(r,k)=>S.entries.filter(e=>(e.kind||'actual')===k&&e.date>=r[0]&&e.date<=r[1]);
const inR=r=>inRk(r,view==='plan'?'plan':'actual');
function stats(l){let t=0,w=0;const by={};
  l.forEach(e=>{t+=e.min;w+=e.min*e.focus;const b=by[e.type]=by[e.type]||{min:0,w:0,n:0};b.min+=e.min;b.w+=e.min*e.focus;b.n++});
  return{t,n:l.length,f:t?w/t:0,by}}
const dlt=(a,b,fn,unit)=>{if(!b)return '<span class="d" style="color:var(--mu)">前期間データなし</span>';
  const x=a-b;if(Math.abs(x)<0.005)return '<span class="d" style="color:var(--mu)">前期間と同じ</span>';
  return `<span class="d ${x>0?'up':'dn'}">${x>0?'▲ +':'▼ −'}${fn(Math.abs(x))}${unit||''}</span>`;
};

function dl(a,b,fn){const x=a-b;if(Math.abs(x)<0.005)return '<span class="d" style="color:var(--mu)">予定どおり</span>';return `<span class="d ${x>0?'up':'dn'}">${x>0?'▲ 予定より +':'▼ 予定より −'}${fn(Math.abs(x))}</span>`}
const hh=m=>Math.round(m/6)/10+'h';
function renderHours(){
  const k=view==='plan'?'plan':'actual',r=range(mode,anchor),l=inRk(r,k).filter(e=>e.start);
  const H=Array.from({length:24},()=>({m:0,w:0}));
  l.forEach(e=>{const p=e.start.split(':').map(Number);let t=p[0]*60+p[1],rem=e.min;while(rem>0&&t<1440){const h=Math.floor(t/60),n=Math.min(rem,(h+1)*60-t);H[h].m+=n;H[h].w+=n*e.focus;t+=n;rem-=n}});
  const used=H.map((x,i)=>({i,m:x.m,w:x.w})).filter(x=>x.m>0);
  if(!used.length){$('#hsum').textContent='この期間に開始時刻つきの記録がありません。記録時に「開始時刻」を入力すると集計されます。';$('#hchart').innerHTML='';return}
  const lo=Math.min(...used.map(x=>x.i)),hi=Math.max(...used.map(x=>x.i)),mxm=Math.max(...used.map(x=>x.m));
  let c='';for(let i=lo;i<=hi;i++){const x=H[i],f=x.m?x.w/x.m:0;c+=`<div class="bk" style="min-width:34px"><span>${x.m?f.toFixed(1):''}</span><div class="bar" style="height:${f/5*70}%;opacity:${x.m?0.25+0.75*x.m/mxm:0.1}"></div><span>${i}時</span></div>`}
  $('#hchart').innerHTML=c;
  const ok=used.filter(x=>x.m>=30);
  if(!ok.length){$('#hsum').textContent='各時間帯の記録がまだ少ない（30分未満）ため、ランキングは表示できません。';return}
  const top=ok.slice().sort((a,b)=>b.w/b.m-a.w/a.m)[0],low=ok.slice().sort((a,b)=>a.w/a.m-b.w/b.m)[0];
  $('#hsum').innerHTML=`最も集中できた時間帯：<b>${top.i}〜${top.i+1}時</b>（平均${(top.w/top.m).toFixed(1)}）`+(ok.length>1?`／最も低い時間帯：${low.i}〜${low.i+1}時（平均${(low.w/low.m).toFixed(1)}）`:'');
}
function render(){
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
  const pl=view==='plan',cm=view==='cmp';
  $('#formcard').hidden=cm;
  $('#ftitle').textContent=pl?'予定を登録':'実績を記録';
  $('#flab').textContent=pl?'想定集中度':'集中力';
  $('#add').textContent=pl?'予定を登録する':'記録する';
  const h=document.querySelectorAll('section h2');
  h[2].textContent=cm?'種類別の予実':'種類別（前の期間との比較つき）';
  h[3].textContent=cm?'予定・実績一覧':pl?'予定一覧':'実績一覧';
  $('#leg').textContent=cm?'点線の棒＝予定／塗りの棒＝実績（ラベルは 予定/実績 の時間）／タップでその期間へ移動':'棒の高さ＝合計時間／濃さ＝平均集中度（濃いほど高い）／タップでその期間へ移動';
  if(cm)renderCmp();else renderBase();
  renderHours();
}
function renderCmp(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  $('#lbl').textContent=label(mode,anchor);
  const r=range(mode,anchor),P=stats(inRk(r,'plan')),A=stats(inRk(r,'actual'));
  const rate=P.t?Math.round(A.t/P.t*100):null;
  $('#kpis').innerHTML=`<div class="kpi"><span>予定時間</span><b>${fmt(P.t)}</b><span>${P.n}件</span></div>`+`<div class="kpi"><span>実績時間</span><b>${fmt(A.t)}</b><span>${A.n}件</span></div>`+`<div class="kpi"><span>達成率（実績÷予定）</span><b>${rate===null?'–':rate+'%'}</b>${P.t||A.t?dl(A.t,P.t,fmt):''}</div>`+`<div class="kpi"><span>平均集中度 予定→実績</span><b>${P.n?P.f.toFixed(1):'–'} → ${A.n?A.f.toFixed(1):'–'}</b>${P.n&&A.n?dl(A.f,P.f,x=>x.toFixed(1)):''}</div>`;
  const N={day:7,week:8,month:6}[mode];
  $('#ctitle').textContent={day:'直近7日の予定と実績',week:'直近8週の予定と実績',month:'直近6か月の予定と実績'}[mode];
  const bs=[];for(let i=N-1;i>=0;i--){const a=shift(mode,anchor,-i),rr=range(mode,a);bs.push({a,p:stats(inRk(rr,'plan')),c:stats(inRk(rr,'actual'))})}
  const mx=Math.max(1,...bs.map(b=>Math.max(b.p.t,b.c.t)));
  $('#chart').innerHTML=bs.map((b,i)=>`<div class="bk ${i===N-1?'cur':''}" data-a="${b.a}"><span>${b.p.t||b.c.t?hh(b.p.t)+'/'+hh(b.c.t):''}</span><div style="display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;height:72%"><div class="bar pb" style="width:40%;height:${b.p.t/mx*100}%"></div><div class="bar" style="width:40%;height:${b.c.t/mx*100}%"></div></div><span>${short(mode,b.a)}</span></div>`).join('');
  const keys=[...new Set([...Object.keys(P.by),...Object.keys(A.by)])].sort((a,b)=>((A.by[b]?.min||0)+(P.by[b]?.min||0))-((A.by[a]?.min||0)+(P.by[a]?.min||0)));
  $('#types').innerHTML=keys.length?'<table><tr><th>種類</th><th>予定</th><th>実績</th><th>差</th><th>達成率</th><th>集中度（予定→実績）</th></tr>'+keys.map(k=>{const p=P.by[k],c=A.by[k],pm=p?p.min:0,cm=c?c.min:0;return `<tr><td>${esc(k)}</td><td>${pm?fmt(pm):'–'}</td><td>${cm?fmt(cm):'–'}</td><td>${dl(cm,pm,fmt)}</td><td>${pm?Math.round(cm/pm*100)+'%':'予定なし'}</td><td>${p?(p.w/p.min).toFixed(1):'–'} → ${c?(c.w/c.min).toFixed(1):'–'}</td></tr>`}).join('')+'</table>':'<div class="empty">この期間の記録はありません</div>';
  const l=[...inRk(r,'plan').map(e=>({...e,k:'予定'})),...inRk(r,'actual').map(e=>({...e,k:'実績'}))].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id);
  $('#list').innerHTML=l.length?'<table><tr><th>日付</th><th>区分</th><th>タスク</th><th>種類</th><th>時間</th><th>集中力</th><th></th></tr>'+l.map(e=>`<tr><td>${e.date.slice(5).replace('-','/')}${e.start?' '+e.start:''}</td><td>${e.k}</td><td>${esc(e.task)}</td><td>${esc(e.type)}</td><td>${fmt(e.min)}</td><td><span class="dots">${'●'.repeat(e.focus)}${'○'.repeat(5-e.focus)}</span></td><td><button class="x" data-del="${e.id}">削除</button></td></tr>`).join('')+'</table>':'<div class="empty">この期間の記録はありません</div>';
}
function renderBase(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===mode));
  $('#lbl').textContent=label(mode,anchor);
  const cur=stats(inR(range(mode,anchor))),pv=stats(inR(range(mode,shift(mode,anchor,-1))));
  const pl={day:'前日',week:'前週',month:'前月'}[mode];
  $('#kpis').innerHTML=
   `<div class="kpi"><span>合計時間</span><b>${fmt(cur.t)}</b>${dlt(cur.t,pv.t,fmt)} <span>${pl}比</span></div>`+
   `<div class="kpi"><span>平均集中度（時間加重）</span><b>${cur.n?cur.f.toFixed(1):'–'} <small>/ 5</small></b>${pv.n?dlt(cur.f,pv.f,x=>x.toFixed(1)):dlt(0,0)} <span>${pl}比</span></div>`+
   `<div class="kpi"><span>タスク数</span><b>${cur.n}件</b>${dlt(cur.n,pv.n,x=>x,'件')}</div>`+
   `<div class="kpi"><span>高集中（4以上）の時間</span><b>${fmt(inR(range(mode,anchor)).filter(e=>e.focus>=4).reduce((s,e)=>s+e.min,0))}</b></div>`;
  const N={day:7,week:8,month:6}[mode];
  $('#ctitle').textContent={day:'直近7日の推移',week:'直近8週の推移',month:'直近6か月の推移'}[mode];
  const bs=[];for(let i=N-1;i>=0;i--){const a=shift(mode,anchor,-i);bs.push({a,s:stats(inR(range(mode,a)))}) }
  const mx=Math.max(1,...bs.map(b=>b.s.t));
  $('#chart').innerHTML=bs.map((b,i)=>`<div class="bk ${i===N-1?'cur':''}" data-a="${b.a}"><span>${b.s.t?fmt(b.s.t):''}</span><div class="bar" style="height:${b.s.t/mx*100*0.72}%;opacity:${b.s.t?0.3+0.14*b.s.f:0.15}"></div><span>${short(mode,b.a)}</span></div>`).join('');
  const keys=[...new Set([...Object.keys(cur.by),...Object.keys(pv.by)])].sort((a,b)=>(cur.by[b]?.min||0)-(cur.by[a]?.min||0));
  $('#types').innerHTML=keys.length?`<table><tr><th>種類</th><th>時間</th><th>割合</th><th>平均集中度</th><th>${pl}比（時間）</th><th>${pl}比（集中度）</th></tr>`+keys.map(k=>{
    const c=cur.by[k],p=pv.by[k],cm=c?c.min:0,cf=c?c.w/c.min:0,pm=p?p.min:0,pf=p?p.w/p.min:0;
    return `<tr><td>${esc(k)}</td><td>${cm?fmt(cm):'–'}</td><td><span class="share" style="width:${cur.t?cm/cur.t*80:0}px"></span> ${cur.t?Math.round(cm/cur.t*100):0}%</td><td>${c?cf.toFixed(1):'–'}</td><td>${dlt(cm,pm,fmt)}</td><td>${c&&p?dlt(cf,pf,x=>x.toFixed(1)):'<span class="d" style="color:var(--mu)">–</span>'}</td></tr>`}).join('')+'</table>':'<div class="empty">この期間の記録はありません</div>';
  const l=inR(range(mode,anchor)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id);
  $('#list').innerHTML=l.length?'<table><tr><th>日付</th><th>タスク</th><th>種類</th><th>時間</th><th>集中力</th><th></th></tr>'+l.map(e=>`<tr><td>${e.date.slice(5).replace('-','/')}${e.start?' '+e.start:''}</td><td>${esc(e.task)}</td><td>${esc(e.type)}</td><td>${fmt(e.min)}</td><td><span class="dots">${'●'.repeat(e.focus)}${'○'.repeat(5-e.focus)}</span></td><td>${view==='plan'?`<button class="x" data-ac="${e.id}">実績へ</button> `:''}<button class="x" data-del="${e.id}">削除</button></td></tr>`).join('')+'</table>':'<div class="empty">この期間の記録はありません</div>';
}

function typeOpts(){$('#type').innerHTML=S.types.map(t=>`<option>${esc(t)}</option>`).join('')+'<option value="__new">＋新しい種類を追加…</option>'}
$('#focus').innerHTML=FL.map((t,i)=>`<button data-f="${i+1}">${i+1}<br>${t}</button>`).join('');
function setFocus(v){focus=v;document.querySelectorAll('#focus button').forEach(b=>b.classList.toggle('on',+b.dataset.f===v))}
setFocus(3);typeOpts();$('#date').value=anchor;

$('#focus').onclick=e=>{const b=e.target.closest('button');if(b)setFocus(+b.dataset.f)};
document.querySelector('.chips').onclick=e=>{const b=e.target.closest('button');if(b)$('#min').value=b.dataset.m};
$('#type').onchange=()=>{$('#ntw').hidden=$('#type').value!=='__new'};
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){mode=b.dataset.mode;render()}};
$('#vtabs').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.view;$('#msg').textContent='';render()}};
$('#prev').onclick=()=>{anchor=shift(mode,anchor,-1);render()};
$('#next').onclick=()=>{anchor=shift(mode,anchor,1);render()};
$('#today').onclick=()=>{anchor=ymd(new Date());render()};
$('#chart').onclick=e=>{const b=e.target.closest('.bk');if(b){anchor=b.dataset.a;render()}};
$('#list').onclick=e=>{const a=e.target.closest('[data-ac]');if(a){const p=S.entries.find(x=>x.id===+a.dataset.ac);if(p){view='actual';$('#date').value=p.date;$('#task').value=p.task;$('#type').value=p.type;$('#min').value=p.min;$('#start').value=p.start||'';setFocus(p.focus);$('#ntw').hidden=true;render();$('#msg').textContent='予定の内容を入力しました。実績に合わせて調整し「記録する」を押してください';window.scrollTo(0,0)}return}const b=e.target.closest('[data-del]');if(b){S.entries=S.entries.filter(x=>x.id!==+b.dataset.del);save();render()}};
$('#add').onclick=()=>{
  const msg=$('#msg');let type=$('#type').value;
  if(type==='__new'){type=$('#ntype').value.trim();if(!type){msg.textContent='種類名を入力してください';return}
    if(!S.types.includes(type))S.types.push(type)}
  const min=parseInt($('#min').value,10),date=$('#date').value,task=$('#task').value.trim();
  if(!date||!(min>0)){msg.textContent='日付と時間（分）を入力してください';return}
  S.entries.push({id:Date.now(),kind:view==='plan'?'plan':'actual',date,start:$('#start').value||'',task:task||'（無題）',type,min,focus});
  save();typeOpts();$('#type').value=type;$('#ntw').hidden=true;$('#ntype').value='';$('#task').value='';$('#start').value='';anchor=date;msg.textContent='記録しました';setTimeout(()=>msg.textContent='',2000);render();
};
render();
</script>
</body>
</html>
